<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#16233A"/></linearGradient>
    <linearGradient id="accentc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <clipPath id="cardc"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#cardc)"><rect width="1280" height="440" fill="url(#bgc)"/><circle cx="60" cy="410" r="180" fill="#38bdf8" opacity="0.07"/><circle cx="1240" cy="-30" r="150" fill="#818cf8" opacity="0.08"/></g>
  <text x="80" y="118" font-size="64" font-weight="700" fill="#f8fafc">followtheme</text>
  <rect x="80" y="140" width="120" height="6" rx="3" fill="url(#accentc)"/>
  <text x="80" y="200" font-size="26" fill="#94a3b8">Each dialog keeps the theme of the section</text>
  <text x="80" y="236" font-size="26" fill="#94a3b8">that opened it.</text>
  <g font-size="18" font-weight="600" text-anchor="middle"><rect x="80" y="290" width="91" height="40" rx="20" fill="#0EA5E9" opacity="0.16"/><text x="125.5" y="316" fill="#7DD3FC">React</text><rect x="181" y="290" width="69" height="40" rx="20" fill="#0EA5E9" opacity="0.16"/><text x="215.5" y="316" fill="#7DD3FC">Vue</text><rect x="260" y="290" width="135" height="40" rx="20" fill="#0EA5E9" opacity="0.16"/><text x="327.5" y="316" fill="#7DD3FC">plain DOM</text></g>
  <text x="80" y="392" font-size="20" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">npm install followtheme</text>
  <!-- bande body -->
  <rect x="700" y="60" width="520" height="320" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="720" y="88" font-size="14" fill="#475569" font-family="Consolas, 'Courier New', monospace">&lt;body&gt;</text>
  <!-- section ocean -->
  <rect x="724" y="104" width="220" height="92" rx="14" fill="#0b3954" stroke="#3dccc7" stroke-width="3"/>
  <text x="744" y="136" font-size="15" fill="#e0fbfc" font-weight="600">ocean</text>
  <rect x="744" y="154" width="70" height="26" rx="7" fill="#3dccc7"/>
  <!-- section sand -->
  <rect x="976" y="104" width="220" height="92" rx="14" fill="#f3d9b1" stroke="#c08552" stroke-width="3"/>
  <text x="996" y="136" font-size="15" fill="#4a3728" font-weight="600">sand</text>
  <rect x="996" y="154" width="70" height="26" rx="7" fill="#c08552"/>
  <!-- traits -->
  <path d="M834 196 L 834 236" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M1086 196 L 1086 236" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- dialogs -->
  <rect x="744" y="240" width="200" height="110" rx="14" fill="#0b3954" stroke="#3dccc7" stroke-width="3"/>
  <text x="764" y="274" font-size="15" fill="#e0fbfc" font-weight="600">Dialog</text><text x="764" y="300" font-size="14" fill="#9fd9dc">still ocean</text>
  <rect x="976" y="240" width="200" height="110" rx="14" fill="#f3d9b1" stroke="#c08552" stroke-width="3"/>
  <text x="996" y="274" font-size="15" fill="#4a3728" font-weight="600">Dialog</text><text x="996" y="300" font-size="14" fill="#7a5a44">still sand</text>
</svg>